[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oubliette-dungeon"
version = "1.1.0"
description = "Standalone AI Red Team Engine - automated adversarial testing for LLM applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Oubliette Security", email = "hello@oubliettesecurity.com"},
]
keywords = ["ai", "red-team", "llm", "security", "adversarial", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "click>=8.0",
    "oubliette-sec-utils>=0.1.2",
]

[project.optional-dependencies]
flask = ["flask>=2.3"]
pdf = ["fpdf2>=2.8.0"]
pyrit = ["pyrit>=0.8,<0.10"]
deepteam = ["deepteam>=1.0"]
inspect = ["inspect-ai>=0.3"]
shield = ["oubliette-shield>=1.0"]
# Ed25519 license verification (Dungeon Pro features such as --suite full).
licensing = ["cryptography>=48.0.1"]
all = [
    "flask>=2.3",
    "fpdf2>=2.8.0",
    "oubliette-shield>=1.0",
    "cryptography>=48.0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "build",
    "twine",
    # Ed25519 license verification, so the licensing tests run instead of skipping.
    "cryptography>=48.0.1",
]

# Full test environment: dev tools + integration deps the test suite imports
# (flask for the dashboard/API tests, inspect-ai for the inspect adapter tests).
# `uv pip install -e ".[test]"` gives a clean green with no manual --with flags.
test = [
    "oubliette-dungeon[dev,flask,inspect,licensing]",
    # tests/test_packaging_boundary.py resolves the package list with
    # setuptools; uv venvs do not ship it, and a silently skipped boundary
    # guard is exactly the failure mode that test exists to prevent.
    "setuptools>=68.0",
]

[project.scripts]
oubliette-dungeon = "oubliette_dungeon.cli.main:cli"

[project.urls]
Homepage = "https://oubliettesecurity.com"
Repository = "https://github.com/oubliettesecurity/oubliette-dungeon"
Documentation = "https://github.com/oubliettesecurity/oubliette-dungeon#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oubliette_dungeon = ["scenarios/*.yaml", "data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", "build", "dist", ".venv", "venv", "redteam_results", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM117",
    "RUF005", "RUF012", "RUF022",
    "B008", "B027", "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841"]
# Third-party adapter integrations collect values that are not yet wired into
# TestResult. The variables document the intended field mapping; drop them
# only when the adapter's next pass lands.
"src/oubliette_dungeon/tools/*_adapter.py" = ["F841"]
