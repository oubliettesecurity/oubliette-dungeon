# Unified suite test gate — identical across every Oubliette repo.
# Mirrors the local contract: Python 3.13 + `uv pip install -e ".[test]"` + pytest.
# Repo-specific lint/mypy/build/release live in other workflow files.
name: test

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv v8+ publishes no floating major/minor tags (immutable
      # releases): pin the exact version tag, e.g. @v10.2.0, not @v10.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # v9 flipped the default to false; keep pruning pre-built wheels
          # before the cache is saved (same behavior as setup-uv v5).
          prune-cache: true

      - name: Create env (Python 3.13)
        run: uv venv --python 3.13

      - name: Install package + test deps
        run: uv pip install -e ".[test]"

      # Call the venv interpreter directly. NOT `uv run pytest`: that re-syncs
      # and universally resolves the project, which fails on heavy optional
      # extras (crewai/pyrit) that don't support every Python in requires-python.
      - name: Run tests
        run: .venv/bin/pytest -q
